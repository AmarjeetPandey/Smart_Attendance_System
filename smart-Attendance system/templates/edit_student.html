{% extends "base.html" %}
{% block title %}Edit Student | Smart Attendance{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">Directory</div><h1>Edit student</h1><p class="muted">Update this student&apos;s details.</p></div><a class="btn secondary" href="{{ url_for('students') }}">Back to students</a></div>
<section class="panel form-panel"><form method="POST"><div class="form-row"><div><label for="name">Full name</label><input id="name" name="name" value="{{ student.name }}" required></div><div><label for="course">Course / Class</label><select id="course" name="course" required><option value="">Select a class / subject</option>{% for choice in course_options %}<option value="{{ choice }}" {% if student.course == choice %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select></div></div><div class="form-row"><div><label for="roll_number">Roll number</label><input id="roll_number" name="roll_number" value="{{ student.roll_number }}" required></div><div><label for="registration_number">Registration number</label><input id="registration_number" name="registration_number" value="{{ student.registration_number }}" required></div></div><div class="form-row"><div><label for="email">Email / Contact</label><input id="email" name="email" type="email" value="{{ student.email }}"></div><div><label for="registration_date">Registration date</label><input id="registration_date" name="registration_date" type="date" value="{{ student.registration_date }}" required></div></div><div class="inline-actions"><a class="btn secondary" href="{{ url_for('manage_courses') }}">+ Add new class</a></div><div class="form-actions"><button class="btn" type="submit">Save changes</button></div></form></section>
{% endblock %}
